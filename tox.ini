[tox]
envlist = py39, py310, py311, py312, flake8

[testenv]
deps =
  -rtest-requirements.txt
  -rrequirements.txt
commands = py.test -v tests/ -m "not integration" --cov binance_chain --cov-report term-missing

[testenv:flake8]
commands = flake8 --exclude binance_chain/protobuf/dex_pb2.py binance_chain/
deps = flake8

[flake8]
exclude =
    .git,
    .tox,
    build,
    dist
ignore = E501

[pep8]
ignore = E501
